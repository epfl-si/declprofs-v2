
- name: Monitoring - AlertmanagerConfig
  kubernetes.core.k8s:
    definition:
      apiVersion: monitoring.coreos.com/v1beta1
      kind: AlertmanagerConfig
      metadata:
        name: alertmanager
        namespace: "{{ inventory_hostname }}"
      spec:
        route:
          receiver: "telegram"
          groupBy: ["alertname"]
          groupWait: 20s
          groupInterval: 5m
          repeatInterval: 3h
          matchers:
            - name: sendto
              value: telegram
              matchType: "="
        receivers:
          - name: "telegram"
            telegramConfigs:
              - botToken:
                  name: telegram-bot-token
                  key: access_token
                chatID: "{{ secrets.telegram_alert.chat_id | int }}"
                message: |
                  {% raw %}
                  {{ range .Alerts }}
                  {{ if eq .Status "firing" }}
                  🚨 FIRING - {{ .Annotations.summary }}
                  {{ .Annotations.description }}
                  Started at (UTC): {{ .StartsAt.Format "2006-01-02 15:04:05" }}
                  {{ else if eq .Status "resolved" }}
                  🟢 RESOLVED - {{ .Annotations.summary }}
                  {{ .Annotations.description }}
                  Started at (UTC): {{ .StartsAt.Format "2006-01-02 15:04:05" }}
                  Ended at (UTC): {{ .EndsAt.Format "2006-01-02 15:04:05" }}
                  {{ end }}
                  {{ end }}
                  {% endraw %}
                sendResolved: true

- name: Monitoring - PrometheusRule
  kubernetes.core.k8s:
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
      metadata:
        name: declprofs-alerts
        namespace: "{{ inventory_hostname }}"
      spec:
        groups:
          - name: pod-alerts
            rules:
              - alert: DeclProfsNginxPodCountMismatch
                expr: >
                  kube_deployment_status_replicas_available{deployment="nginx", namespace="{{ inventory_hostname }}"}
                  < kube_deployment_spec_replicas{deployment="nginx", namespace="{{ inventory_hostname }}"}
                for: 3m
                labels:
                  severity: critical
                  sendto: telegram
                annotations:
                  summary: "Pod count mismatch (nginx)"
                  description: "The deployment nginx has not the desired number of pods for over 3 minutes."
              - alert: DeclProfsAppPodCountMismatch
                expr: >
                  kube_deployment_status_replicas_available{deployment="{{ django.name }}", namespace="{{ inventory_hostname }}"}
                  < kube_deployment_spec_replicas{deployment="{{ django.name }}", namespace="{{ inventory_hostname }}"}
                for: 3m
                labels:
                  severity: critical
                  sendto: telegram
                annotations:
                  summary: "Pod count mismatch ({{ django.name }})"
                  description: "The deployment {{ django.name }} has not the desired number of pods for over 3 minutes."
