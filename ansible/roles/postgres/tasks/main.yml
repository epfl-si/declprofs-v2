---
- name: Deploy secrets
  ansible.builtin.include_tasks:
    file: secrets.yml
    apply:
      tags: [postgres.secrets]
  tags: [postgres.secrets]

- name: Deploy cluster
  ansible.builtin.include_tasks:
    file: cluster.yml
    apply:
      tags: [postgres.cluster]
  tags: [postgres.cluster]

- name: Restore cluster
  ansible.builtin.include_tasks:
    file: restore.yml
    apply:
      tags: [never, postgres.restore]
  tags: [never, postgres.restore]
