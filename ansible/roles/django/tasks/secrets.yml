- name: Create django secrets
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: django-secrets
        namespace: "{{ inventory_hostname }}"
      type: Opaque
      stringData:
        DJANGO_ENV_MODE: "{{ env }}"
        DJANGO_SECRET_KEY: "{{ secrets.django.secret_key }}"
        DJANGO_DEBUG_MODE: "{{ secrets.django.debug_mode | string }}"
        DJANGO_ALLOWED_HOSTS: "{{ secrets.django.allowed_hosts }}"
        DJANGO_CSRF_TRUSTED_ORIGINS: "{{ secrets.django.csrf_trusted_origins }}"
        DJANGO_POSTGRES_HOST: "{{ secrets.postgres.host }}"
        DJANGO_POSTGRES_NAME: "{{ secrets.postgres.name }}"
        DJANGO_POSTGRES_USER: "{{ secrets.postgres.user }}"
        DJANGO_POSTGRES_PASSWORD: "{{ secrets.postgres.password }}"
        DJANGO_POSTGRES_PORT: "{{ secrets.postgres.port | string }}"
        DJANGO_OIDC_TENANT_ID: "{{ secrets.django.oidc.tenant }}"
        DJANGO_OIDC_RP_CLIENT_ID: "{{ secrets.django.oidc.client_id }}"
        DJANGO_OIDC_RP_CLIENT_SECRET: "{{ secrets.django.oidc.client_secret }}"
        DJANGO_EMAIL_BACKEND: "{{ secrets.email.backend }}"
        DJANGO_EMAIL_HOST: "{{ secrets.email.host }}"
        DJANGO_EMAIL_PORT: "{{ secrets.email.port | string }}"
        DJANGO_EMAIL_HOST_USER: "{{ secrets.email.host_user }}"
        DJANGO_EMAIL_HOST_PASSWORD: "{{ secrets.email.host_password }}"
        DJANGO_DEFAULT_FROM_EMAIL: "{{ secrets.email.default }}"
        DJANGO_SERVICE_ACCOUNT_NAME: "{{ secrets.epfl_service.name }}"
        DJANGO_SERVICE_ACCOUNT_PASSWORD: "{{ secrets.epfl_service.password }}"
        PAGINATION_ACTIVITIES: "{{ secrets.pagination.activities | string }}"
        PAGINATION_LOGS: "{{ secrets.pagination.logs | string }}"
